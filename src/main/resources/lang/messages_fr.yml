# ============================================================
#  DeACoudre - messages (français) - format MiniMessage
#  https://docs.papermc.io/adventure/minimessage/format/
#
#  Pour utiliser ce fichier : language: fr dans config.yml, supprimer
#  messages.yml puis /dac reload. (Ou copier ce fichier en messages.yml.)
#
#  Placeholders internes : %prefix% %player% %arena% %current% %max%
#  %min% %seconds% %alive% %color% (+ ceux indiqués à côté des messages).
#  Un message vide ("") n'est pas envoyé.
# ============================================================

prefix: "<dark_gray>[<aqua>Dé à Coudre<dark_gray>] "

help:
  header: "<dark_gray><st>          </st> <aqua><bold>Dé à Coudre</bold> <dark_gray><st>          </st>"
  line: "<yellow>%usage% <dark_gray>- <gray>%description%"
  usages:
    help: "help"
    join: "join [arène]"
    leave: "leave"
    block: "block"
    list: "list"
    create: "create <arène>"
    delete: "delete <arène>"
    setlobby: "setlobby <arène>"
    setjump: "setjump <arène>"
    setspectator: "setspectator <arène>"
    pos1: "pos1 <arène>"
    pos2: "pos2 <arène>"
    setplayers: "setplayers <arène> <min> <max> | reset"
    enable: "enable <arène>"
    disable: "disable <arène>"
    info: "info <arène>"
    stop: "stop <arène>"
    forcestart: "forcestart <arène>"
    reload: "reload"
  descriptions:
    help: "Affiche cette aide"
    join: "Rejoint une arène (ou une arène libre)"
    leave: "Quitte la partie en cours"
    block: "Choisis ton bloc (dans le lobby)"
    list: "Liste les arènes"
    create: "Crée une arène"
    delete: "Supprime une arène"
    setlobby: "Définit le lobby à ta position"
    setjump: "Définit la plateforme de saut à ta position"
    setspectator: "Définit le point spectateur / d'attente"
    pos1: "Définit le premier coin du bassin"
    pos2: "Définit le second coin du bassin"
    setplayers: "Définit le minimum / maximum de joueurs"
    enable: "Active l'arène (si elle est valide)"
    disable: "Désactive l'arène"
    info: "Affiche la configuration d'une arène"
    stop: "Arrête proprement la partie en cours"
    forcestart: "Lance la partie immédiatement"
    reload: "Recharge config.yml et messages.yml"

game:
  joined: "%prefix%<green>Tu as rejoint l'arène <yellow>%arena%<green>."
  left: "%prefix%<red>Tu as quitté la partie."
  player-joined: "%prefix%<yellow>%player% <gray>a rejoint la partie. <dark_gray>(<white>%current%/%max%<dark_gray>)"
  player-left: "%prefix%<yellow>%player% <gray>a quitté la partie. <dark_gray>(<white>%current%/%max%<dark_gray>)"
  left-teleport: "%prefix%<red>Tu as été téléporté hors de l'arène : tu as quitté la partie."
  restored: "%prefix%<green>Ton inventaire et ta position d'avant la partie ont été restaurés."
  error: "%prefix%<red>Une erreur est survenue, la partie a été arrêtée et restaurée."
  not-enough-blocks: "%prefix%<red>La partie ne peut pas démarrer : pas assez de blocs différents pour tous les joueurs."
  stopped: "%prefix%<red>La partie a été arrêtée par un administrateur."
  area-limit: "%prefix%<red>Tu ne peux pas quitter l'arène pendant la partie."
  spectator: "%prefix%<gray>Tu es maintenant spectateur. <dark_gray>(/dac leave pour quitter)"

  countdown:
    start: "%prefix%<green>La partie commence dans <yellow>%seconds% secondes<green>."
    cancelled: "%prefix%<red>Compte à rebours annulé : pas assez de joueurs."
    shortened: "%prefix%<green>L'arène est pleine ! Début dans <yellow>%seconds% secondes<green>."
    actionbar: "<green>La partie commence dans <yellow>%seconds%s"
    # %countdown_color% = couleur de la seconde (colors ci-dessous)
    title: "%countdown_color%<bold>%seconds%"
    subtitle: "<gray>Prépare-toi !"
    colors:
      "5": "<green>"
      "4": "<green>"
      "3": "<yellow>"
      "2": "<gold>"
      "1": "<red>"
      default: "<yellow>"

  start:
    title: "<aqua><bold>C'EST PARTI !"
    subtitle: "<gray>Ton bloc : %color%"
    color: "%prefix%<gray>Ton bloc : %color%<gray>."
    message: "%prefix%<green>La partie commence ! <gray>Ordre de passage : %order%"

  turn:
    your-turn-title: "<green><bold>À TON TOUR !"
    your-turn-subtitle: "<yellow>Saute dans l'eau"
    other-player: "%prefix%<gray>C'est au tour de <yellow>%player%<gray>."
    actionbar-self: "<yellow>Temps restant : <white>%seconds%s"
    actionbar-others: "<gray>Tour de <yellow>%player% <dark_gray>- <white>%seconds%s"
    bossbar: "<yellow>Tour de %player% <gray>— <white>%seconds% s"

  success: "%prefix%<green>%player% a réussi son saut !"
  success-title: "<green><bold>RÉUSSI !"
  success-subtitle: "<gray>Ton bloc %color% <gray>a été posé"

  eliminated: "%prefix%<red>%player% a été éliminé !"
  timeout: "%prefix%<red>%player% n'a pas sauté à temps."
  fail:
    hit-block: "%prefix%<red>%player% est tombé sur un bloc et est éliminé !"
    out-of-pool: "%prefix%<red>%player% a raté le bassin et est éliminé !"
    out-of-zone: "%prefix%<red>%player% est sorti de la zone de saut et est éliminé !"
  eliminated-title: "<red><bold>ÉLIMINÉ"
  eliminated-subtitle: "<gray>Tu peux regarder la fin de la partie"

  # Vies (%lives% = vies restantes, %max_lives% = maximum)
  life-lost: "%prefix%<red>✖ Saut raté ! Il te reste <white>%lives% <red>vie(s)."
  life-lost-broadcast: "%prefix%<yellow>%player% <gray>a raté son saut et perd une vie <dark_gray>(<white>%lives% <gray>restante(s)<dark_gray>)"
  life-lost-title: "<red><bold>-1 VIE"
  life-lost-subtitle: "<gray>Il te reste <white>%lives% <gray>vie(s)"
  eliminated-no-lives: "%prefix%<red>Tu n'as plus de vie : tu es éliminé."
  # Dé à Coudre (saut dans un trou d'eau 1×1)
  perfect-jump-broadcast: "%prefix%<gold>★ %player% <yellow>a réussi un Dé à Coudre !"
  life-gained: "%prefix%<gold>★ Dé à Coudre ! Saut parfait dans un trou 1×1 : <green>+1 vie. <dark_gray>(<white>%lives%/%max_lives%<dark_gray>)"
  life-gained-title: "<gold><bold>+1 VIE"
  life-gained-subtitle: "<yellow>Dé à Coudre !"
  lives-max: "%prefix%<gold>★ Dé à Coudre ! <gray>Tu as déjà le maximum de vies (<white>%max_lives%<gray>)."

  pool-full: "%prefix%<yellow>Le bassin est entièrement rempli !"
  winner: "%prefix%<gold>%player% remporte la partie !"
  victory-title: "<gold><bold>VICTOIRE !"
  victory-subtitle: "<yellow>%player% remporte la partie !"
  no-winner: "%prefix%<gray>Aucun gagnant pour cette partie."
  no-winner-title: "<red><bold>Aucun gagnant !"
  no-winner-subtitle: ""
  draw: "%prefix%<yellow>La partie se termine sur une égalité."
  draw-survivors: "%prefix%<gray>Survivants : %players%"
  draw-title: "<yellow><bold>ÉGALITÉ !"
  draw-subtitle: "<gray>Le bassin est rempli"
  ending: "%prefix%<gray>Retour dans <yellow>%seconds% secondes<gray>..."

# Sélecteur de bloc (%block% = nom du bloc, section colors)
selector:
  title: "<dark_gray>Choisis ton bloc"
  hint: "%prefix%<gray>Choisis ton bloc avec l'item de ta barre ou <yellow>/dac block<gray>."
  hint-command: "%prefix%<gray>Choisis ton bloc avec <yellow>/dac block<gray>."
  item-name: "<aqua>Choisir mon bloc <gray>(clic droit)"
  item-lore:
    - "<gray>Choisis le bloc qui remplira"
    - "<gray>tes cases du bassin."
  lore-available:
    - "<green>Disponible"
    - "<yellow>Clic pour choisir"
  lore-selected:
    - "<aqua>✔ Ton bloc actuel"
  lore-taken:
    - "<red>Indisponible"
    - "<gray>Déjà choisi par <white>%player%"
  selected: "%prefix%<green>Ton bloc : %block%<green>."
  taken: "%prefix%<red>Ce bloc est déjà choisi par un autre joueur."
  not-allowed: "%prefix%<red>Ce bloc n'est pas autorisé."
  not-in-lobby: "%prefix%<red>Tu ne peux choisir ton bloc que dans le lobby, avant le début de la partie."
  disabled: "%prefix%<red>Le choix du bloc est désactivé sur ce serveur."

errors:
  arena-not-found: "%prefix%<red>Cette arène n'existe pas."
  arena-full: "%prefix%<red>Cette arène est pleine."
  already-playing: "%prefix%<red>Tu participes déjà à une partie."
  game-started: "%prefix%<red>Cette partie a déjà commencé."
  no-permission: "%prefix%<red>Tu n'as pas la permission."
  arena-disabled: "%prefix%<red>L'arène <yellow>%arena% <red>est désactivée."
  world-not-loaded: "%prefix%<red>Le monde <yellow>%world% <red>de l'arène n'est pas chargé."
  no-arena-available: "%prefix%<red>Aucune arène disponible pour le moment."
  not-in-game: "%prefix%<red>Tu ne participes à aucune partie."
  join-failed: "%prefix%<red>Impossible de te téléporter dans l'arène."
  unknown-command: "%prefix%<red>Commande inconnue. <gray>Fais <yellow>/dac help<gray>."
  player-only: "%prefix%<red>Cette commande doit être exécutée par un joueur."
  usage: "%prefix%<red>Utilisation : <yellow>%usage%"
  invalid-name: "%prefix%<red>Nom invalide : lettres, chiffres, _ et - uniquement (32 caractères max)."
  arena-exists: "%prefix%<red>L'arène <yellow>%arena% <red>existe déjà."
  arena-in-use: "%prefix%<red>Des joueurs sont dans l'arène <yellow>%arena%<red>. Fais <yellow>/dac stop %arena% <red>avant de la modifier."
  different-world: "%prefix%<red>Toutes les positions de l'arène doivent être dans le monde <yellow>%world%<red>."
  invalid-number: "%prefix%<red>Nombre invalide."
  invalid-limits: "%prefix%<red>Il faut 1 ≤ min ≤ max ≤ 100."
  command-blocked: "%prefix%<red>Cette commande est bloquée pendant la partie."
  teleport-blocked: "%prefix%<red>Téléportation bloquée : tu es dans une partie. <gray>(/dac leave)"

list:
  empty: "%prefix%<gray>Aucune arène."
  header: "%prefix%<gray>Arènes (<white>%count%<gray>) :"
  entry: "<dark_gray> - <yellow>%arena% <dark_gray>- <white>%current%/%max% <dark_gray>- %state%"

states:
  WAITING: "<green>En attente"
  STARTING: "<yellow>Démarrage"
  PLAYING: "<gold>En partie"
  ENDING: "<gold>Fin de partie"
  RESETTING: "<gray>Réinitialisation"
  DISABLED: "<red>Désactivée"
  UNAVAILABLE: "<red>Monde non chargé"

words:
  "yes": "<green>Oui"
  "no": "<red>Non"
  none: "<gray>-"
  set: "<green>Oui <dark_gray>(%position%)"
  unset: "<red>Non"

admin:
  created: "%prefix%<green>Arène <yellow>%arena% <green>créée. <gray>Configure-la puis fais <yellow>/dac enable %arena%<gray>."
  deleted: "%prefix%<green>Arène <yellow>%arena% <green>supprimée."
  lobby-set: "%prefix%<green>Lobby de <yellow>%arena% <green>défini <gray>(%position%)."
  jump-set: "%prefix%<green>Plateforme de saut de <yellow>%arena% <green>définie <gray>(%position%)."
  spectator-set: "%prefix%<green>Point spectateur de <yellow>%arena% <green>défini <gray>(%position%)."
  pos1-set: "%prefix%<green>Premier coin du bassin de <yellow>%arena% <green>défini <gray>(%position%)."
  pos2-set: "%prefix%<green>Second coin du bassin de <yellow>%arena% <green>défini <gray>(%position%)."
  players-set: "%prefix%<green>Joueurs de <yellow>%arena% <green>: min <white>%min%<green>, max <white>%max%<green>."
  players-reset: "%prefix%<green>Joueurs de <yellow>%arena% <green>remis aux valeurs globales (min <white>%min%<green>, max <white>%max%<green>)."
  enabled: "%prefix%<green>Arène <yellow>%arena% <green>activée <gray>(%cells% cases d'eau, surface Y=%surface%)."
  already-enabled: "%prefix%<yellow>L'arène %arena% est déjà activée."
  enable-failed: "%prefix%<red>Impossible d'activer <yellow>%arena%<red>, configuration incomplète :"
  auto-disabled: "%prefix%<red>La configuration de <yellow>%arena% <red>n'est plus valide : l'arène a été désactivée."
  validation-prefix: "<dark_gray> - "
  disabled: "%prefix%<green>Arène <yellow>%arena% <green>désactivée."
  already-disabled: "%prefix%<yellow>L'arène %arena% est déjà désactivée."
  stopped: "%prefix%<green>Partie de <yellow>%arena% <green>arrêtée, joueurs et bassin restaurés."
  not-running: "%prefix%<yellow>Aucune partie en cours dans %arena%."
  forcestart: "%prefix%<green>Démarrage forcé de <yellow>%arena%<green>."
  forcestart-failed: "%prefix%<red>Impossible de forcer le démarrage (aucun joueur dans le lobby ou partie déjà lancée)."
  reloaded: "%prefix%<green>Configuration rechargée <gray>(%arenas% arènes)."
  info:
    - "<dark_gray><st>        </st> <aqua>Arène %arena% <dark_gray><st>        </st>"
    - "<gray>État : %state% <dark_gray>| <gray>Activée : %enabled%"
    - "<gray>Monde : <white>%world% <dark_gray>(<gray>chargé : %world_loaded%<dark_gray>)"
    - "<gray>Joueurs : <white>%current%/%max% <dark_gray>(<gray>min <white>%min%<dark_gray>)"
    - "<gray>Lobby : %lobby%"
    - "<gray>Jump : %jump%"
    - "<gray>Spectator : %spectator%"
    - "<gray>Pos1 : %pos1% <dark_gray>| <gray>Pos2 : %pos2%"
    - "<gray>Bassin : %pool% <dark_gray>(<white>%pool_size%<dark_gray>, <white>%cells% <gray>cases, surface Y=<white>%surface%<dark_gray>)"
    - "<gray>Partie en cours : %game% <dark_gray>| <gray>Tour : <white>%turn%"
    - "<gray>Configuration valide : %valid%"

validation:
  world-missing: "<red>Aucun monde défini (définis une position en jeu)."
  world-not-loaded: "<red>Le monde <yellow>%world% <red>n'est pas chargé."
  lobby-missing: "<red>Lobby non défini <gray>(/dac setlobby %arena%)"
  jump-missing: "<red>Plateforme de saut non définie <gray>(/dac setjump %arena%)"
  spectator-missing: "<red>Point spectateur non défini <gray>(/dac setspectator %arena%)"
  pos1-missing: "<red>Premier coin du bassin non défini <gray>(/dac pos1 %arena%)"
  pos2-missing: "<red>Second coin du bassin non défini <gray>(/dac pos2 %arena%)"
  invalid-limits: "<red>Limites de joueurs invalides (min %min%, max %max%)."
  min-greater-than-max: "<red>Le minimum de joueurs (%min%) est supérieur au maximum (%max%)."
  not-enough-blocks: "<red>Seulement %blocks% blocs uniques pour %max% joueurs max : ajoute des blocs à block-selector.materials ou baisse le maximum."
  pool-too-large: "<red>Bassin trop grand : %width%x%length% (max %max_width%x%max_length%)."
  pool-too-deep: "<red>Bassin trop haut : %depth% blocs (max %max_depth%)."
  pool-out-of-world: "<red>Le bassin sort des limites de hauteur du monde."
  pool-no-water: "<red>La zone du bassin ne contient pas d'eau."
  jump-inside-pool: "<red>La plateforme de saut est à l'intérieur du bassin."
  lobby-inside-pool: "<red>Le lobby est à l'intérieur du bassin."
  spectator-inside-pool: "<red>Le point spectateur est à l'intérieur du bassin."
  jump-too-low: "<red>La plateforme de saut doit être au moins 2 blocs au-dessus de la surface de l'eau (Y=%surface%)."

# Noms des blocs. Un bloc absent de cette liste utilise le nom Minecraft,
# traduit automatiquement dans la langue du joueur.
colors:
  WHITE_CONCRETE: "<white>Béton blanc"
  ORANGE_CONCRETE: "<gold>Béton orange"
  MAGENTA_CONCRETE: "<light_purple>Béton magenta"
  LIGHT_BLUE_CONCRETE: "<aqua>Béton bleu clair"
  YELLOW_CONCRETE: "<yellow>Béton jaune"
  LIME_CONCRETE: "<green>Béton vert clair"
  PINK_CONCRETE: "<#F38BAA>Béton rose"
  GRAY_CONCRETE: "<dark_gray>Béton gris"
  LIGHT_GRAY_CONCRETE: "<gray>Béton gris clair"
  CYAN_CONCRETE: "<dark_aqua>Béton cyan"
  PURPLE_CONCRETE: "<dark_purple>Béton violet"
  BLUE_CONCRETE: "<blue>Béton bleu"
  BROWN_CONCRETE: "<#835432>Béton marron"
  GREEN_CONCRETE: "<dark_green>Béton vert"
  RED_CONCRETE: "<red>Béton rouge"
  BLACK_CONCRETE: "<#3C3C3C>Béton noir"

scoreboard:
  title: "<aqua><bold>DÉ À COUDRE"
  countdown: "<white>%seconds% secondes"
  waiting-players: "<gray>%needed% joueur(s) manquant(s)"
  block-random: "<gray>Aléatoire"
  # %hearts% = une icône par vie (pleine / perdue). Alternative texte : "<white>%lives% / %max_lives%"
  heart-full: "<red>❤"
  heart-empty: "<dark_gray>♡"
  status:
    WAITING: "<gray>En attente"
    ALIVE: "<green>En vie"
    ELIMINATED: "<red>Éliminé"
  lobby:
    - ""
    - "<gray>Arène: <white>%arena%"
    - " "
    - "<gray>Joueurs:"
    - "<white>%current%/%max%"
    - "  "
    - "<gray>Début:"
    - "%countdown%"
    - "   "
    - "<gray>Bloc: %block%"
    - "    "
    - "<yellow>%server%"
  game:
    - ""
    - "<gray>Arène: <white>%arena%"
    - " "
    - "<gray>En vie:"
    - "<white>%alive%/%total%"
    - "  "
    - "<gray>Tour:"
    - "%turn%"
    - "   "
    - "<gray>Ton bloc:"
    - "%color%"
    - "    "
    - "<gray>Temps: <white>%time%"
    - "<gray>Vies: %hearts%"
    - "<yellow>%server%"
  ending:
    - ""
    - "<gray>Arène: <white>%arena%"
    - " "
    - "<gold>Partie terminée"
    - "  "
    - "<gray>Ton statut: %status%"
    - "<gray>Sauts réussis: <white>%jumps%"
    - "   "
    - "<yellow>%server%"
