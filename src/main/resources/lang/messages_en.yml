# ============================================================
#  DeACoudre - messages (English) - MiniMessage format
#  https://docs.papermc.io/adventure/minimessage/format/
#
#  To use another bundled language: set "language" in config.yml,
#  delete messages.yml and run /dac reload (or copy lang/messages_xx.yml
#  over messages.yml).
#
#  Internal placeholders: %prefix% %player% %arena% %current% %max%
#  %min% %seconds% %alive% %color% (+ the ones listed next to messages).
#  An empty message ("") is not sent.
# ============================================================

prefix: "<dark_gray>[<aqua>Dé à Coudre<dark_gray>] "

help:
  header: "<dark_gray><st>          </st> <aqua><bold>Dé à Coudre</bold> <dark_gray><st>          </st>"
  line: "<yellow>%usage% <dark_gray>- <gray>%description%"
  usages:
    help: "help"
    join: "join [arena]"
    leave: "leave"
    block: "block"
    list: "list"
    create: "create <arena>"
    delete: "delete <arena>"
    setlobby: "setlobby <arena>"
    setjump: "setjump <arena>"
    setspectator: "setspectator <arena>"
    pos1: "pos1 <arena>"
    pos2: "pos2 <arena>"
    setplayers: "setplayers <arena> <min> <max> | reset"
    enable: "enable <arena>"
    disable: "disable <arena>"
    info: "info <arena>"
    stop: "stop <arena>"
    forcestart: "forcestart <arena>"
    reload: "reload"
  descriptions:
    help: "Shows this help"
    join: "Joins an arena (or any available arena)"
    leave: "Leaves the current game"
    block: "Chooses your block (in the lobby)"
    list: "Lists the arenas"
    create: "Creates an arena"
    delete: "Deletes an arena"
    setlobby: "Sets the lobby at your position"
    setjump: "Sets the jump platform at your position"
    setspectator: "Sets the spectator / waiting point"
    pos1: "Sets the first corner of the pool"
    pos2: "Sets the second corner of the pool"
    setplayers: "Sets the minimum / maximum number of players"
    enable: "Enables the arena (if it is valid)"
    disable: "Disables the arena"
    info: "Shows the configuration of an arena"
    stop: "Stops the current game cleanly"
    forcestart: "Starts the game right away"
    reload: "Reloads config.yml and messages.yml"

game:
  joined: "%prefix%<green>You joined the arena <yellow>%arena%<green>."
  left: "%prefix%<red>You left the game."
  player-joined: "%prefix%<yellow>%player% <gray>joined the game. <dark_gray>(<white>%current%/%max%<dark_gray>)"
  player-left: "%prefix%<yellow>%player% <gray>left the game. <dark_gray>(<white>%current%/%max%<dark_gray>)"
  left-teleport: "%prefix%<red>You were teleported out of the arena: you left the game."
  restored: "%prefix%<green>Your inventory and position from before the game have been restored."
  error: "%prefix%<red>An error occurred, the game has been stopped and restored."
  not-enough-blocks: "%prefix%<red>The game cannot start: there are not enough different blocks for every player."
  stopped: "%prefix%<red>The game has been stopped by an administrator."
  area-limit: "%prefix%<red>You cannot leave the arena during the game."
  spectator: "%prefix%<gray>You are now a spectator. <dark_gray>(/dac leave to quit)"

  countdown:
    start: "%prefix%<green>The game starts in <yellow>%seconds% seconds<green>."
    cancelled: "%prefix%<red>Countdown cancelled: not enough players."
    shortened: "%prefix%<green>The arena is full! Starting in <yellow>%seconds% seconds<green>."
    actionbar: "<green>The game starts in <yellow>%seconds%s"
    # %countdown_color% = color of the current second (colors below)
    title: "%countdown_color%<bold>%seconds%"
    subtitle: "<gray>Get ready!"
    colors:
      "5": "<green>"
      "4": "<green>"
      "3": "<yellow>"
      "2": "<gold>"
      "1": "<red>"
      default: "<yellow>"

  start:
    title: "<aqua><bold>GO!"
    subtitle: "<gray>Your block: %color%"
    color: "%prefix%<gray>Your block: %color%<gray>."
    message: "%prefix%<green>The game begins! <gray>Jump order: %order%"

  turn:
    your-turn-title: "<green><bold>YOUR TURN!"
    your-turn-subtitle: "<yellow>Jump into the water"
    other-player: "%prefix%<gray>It is <yellow>%player%<gray>'s turn."
    actionbar-self: "<yellow>Time left: <white>%seconds%s"
    actionbar-others: "<gray>%player%'s turn <dark_gray>- <white>%seconds%s"
    bossbar: "<yellow>%player%'s turn <gray>— <white>%seconds% s"

  success: "%prefix%<green>%player% made the jump!"
  success-title: "<green><bold>WELL DONE!"
  success-subtitle: "<gray>Your block %color% <gray>has been placed"

  eliminated: "%prefix%<red>%player% has been eliminated!"
  timeout: "%prefix%<red>%player% did not jump in time."
  fail:
    hit-block: "%prefix%<red>%player% landed on a block and is eliminated!"
    out-of-pool: "%prefix%<red>%player% missed the pool and is eliminated!"
    out-of-zone: "%prefix%<red>%player% left the jump area and is eliminated!"
  eliminated-title: "<red><bold>ELIMINATED"
  eliminated-subtitle: "<gray>You can watch the rest of the game"

  # Lives (%lives% = lives left, %max_lives% = maximum)
  life-lost: "%prefix%<red>✖ Missed jump! You have <white>%lives% <red>life/lives left."
  life-lost-broadcast: "%prefix%<yellow>%player% <gray>missed their jump and loses a life <dark_gray>(<white>%lives% <gray>left<dark_gray>)"
  life-lost-title: "<red><bold>-1 LIFE"
  life-lost-subtitle: "<gray><white>%lives% <gray>life/lives left"
  eliminated-no-lives: "%prefix%<red>You have no lives left: you are eliminated."
  # Dé à Coudre (jump into a 1×1 water hole)
  perfect-jump-broadcast: "%prefix%<gold>★ %player% <yellow>made a Dé à Coudre!"
  life-gained: "%prefix%<gold>★ Dé à Coudre! Perfect jump into a 1×1 hole: <green>+1 life. <dark_gray>(<white>%lives%/%max_lives%<dark_gray>)"
  life-gained-title: "<gold><bold>+1 LIFE"
  life-gained-subtitle: "<yellow>Dé à Coudre!"
  lives-max: "%prefix%<gold>★ Dé à Coudre! <gray>You already have the maximum number of lives (<white>%max_lives%<gray>)."

  pool-full: "%prefix%<yellow>The pool is completely filled!"
  winner: "%prefix%<gold>%player% wins the game!"
  victory-title: "<gold><bold>VICTORY!"
  victory-subtitle: "<yellow>%player% wins the game!"
  no-winner: "%prefix%<gray>No winner this time."
  no-winner-title: "<red><bold>No winner!"
  no-winner-subtitle: ""
  draw: "%prefix%<yellow>The game ends in a draw."
  draw-survivors: "%prefix%<gray>Survivors: %players%"
  draw-title: "<yellow><bold>DRAW!"
  draw-subtitle: "<gray>The pool is full"
  ending: "%prefix%<gray>Back in <yellow>%seconds% seconds<gray>..."

# Block selector (%block% = block name, see the colors section)
selector:
  title: "<dark_gray>Choose your block"
  hint: "%prefix%<gray>Choose your block with the item in your hotbar or <yellow>/dac block<gray>."
  hint-command: "%prefix%<gray>Choose your block with <yellow>/dac block<gray>."
  item-name: "<aqua>Choose my block <gray>(right click)"
  item-lore:
    - "<gray>Choose the block that will fill"
    - "<gray>your cells of the pool."
  lore-available:
    - "<green>Available"
    - "<yellow>Click to choose"
  lore-selected:
    - "<aqua>✔ Your current block"
  lore-taken:
    - "<red>Unavailable"
    - "<gray>Already chosen by <white>%player%"
  selected: "%prefix%<green>Your block: %block%<green>."
  taken: "%prefix%<red>This block has already been chosen by another player."
  not-allowed: "%prefix%<red>This block is not allowed."
  not-in-lobby: "%prefix%<red>You can only choose your block in the lobby, before the game starts."
  disabled: "%prefix%<red>Block selection is disabled on this server."

errors:
  arena-not-found: "%prefix%<red>This arena does not exist."
  arena-full: "%prefix%<red>This arena is full."
  already-playing: "%prefix%<red>You are already in a game."
  game-started: "%prefix%<red>This game has already started."
  no-permission: "%prefix%<red>You do not have permission."
  arena-disabled: "%prefix%<red>The arena <yellow>%arena% <red>is disabled."
  world-not-loaded: "%prefix%<red>The world <yellow>%world% <red>of the arena is not loaded."
  no-arena-available: "%prefix%<red>No arena is available right now."
  not-in-game: "%prefix%<red>You are not in a game."
  join-failed: "%prefix%<red>Unable to teleport you to the arena."
  unknown-command: "%prefix%<red>Unknown command. <gray>Use <yellow>/dac help<gray>."
  player-only: "%prefix%<red>This command must be run by a player."
  usage: "%prefix%<red>Usage: <yellow>%usage%"
  invalid-name: "%prefix%<red>Invalid name: letters, digits, _ and - only (32 characters max)."
  arena-exists: "%prefix%<red>The arena <yellow>%arena% <red>already exists."
  arena-in-use: "%prefix%<red>Players are in the arena <yellow>%arena%<red>. Use <yellow>/dac stop %arena% <red>before editing it."
  different-world: "%prefix%<red>Every position of the arena must be in the world <yellow>%world%<red>."
  invalid-number: "%prefix%<red>Invalid number."
  invalid-limits: "%prefix%<red>Required: 1 ≤ min ≤ max ≤ 100."
  command-blocked: "%prefix%<red>This command is blocked during the game."
  teleport-blocked: "%prefix%<red>Teleport blocked: you are in a game. <gray>(/dac leave)"

list:
  empty: "%prefix%<gray>No arena."
  header: "%prefix%<gray>Arenas (<white>%count%<gray>):"
  entry: "<dark_gray> - <yellow>%arena% <dark_gray>- <white>%current%/%max% <dark_gray>- %state%"

states:
  WAITING: "<green>Waiting"
  STARTING: "<yellow>Starting"
  PLAYING: "<gold>In game"
  ENDING: "<gold>Ending"
  RESETTING: "<gray>Resetting"
  DISABLED: "<red>Disabled"
  UNAVAILABLE: "<red>World not loaded"

words:
  "yes": "<green>Yes"
  "no": "<red>No"
  none: "<gray>-"
  set: "<green>Yes <dark_gray>(%position%)"
  unset: "<red>No"

admin:
  created: "%prefix%<green>Arena <yellow>%arena% <green>created. <gray>Configure it, then use <yellow>/dac enable %arena%<gray>."
  deleted: "%prefix%<green>Arena <yellow>%arena% <green>deleted."
  lobby-set: "%prefix%<green>Lobby of <yellow>%arena% <green>set <gray>(%position%)."
  jump-set: "%prefix%<green>Jump platform of <yellow>%arena% <green>set <gray>(%position%)."
  spectator-set: "%prefix%<green>Spectator point of <yellow>%arena% <green>set <gray>(%position%)."
  pos1-set: "%prefix%<green>First corner of the pool of <yellow>%arena% <green>set <gray>(%position%)."
  pos2-set: "%prefix%<green>Second corner of the pool of <yellow>%arena% <green>set <gray>(%position%)."
  players-set: "%prefix%<green>Players of <yellow>%arena%<green>: min <white>%min%<green>, max <white>%max%<green>."
  players-reset: "%prefix%<green>Players of <yellow>%arena% <green>reset to the global values (min <white>%min%<green>, max <white>%max%<green>)."
  enabled: "%prefix%<green>Arena <yellow>%arena% <green>enabled <gray>(%cells% water cells, surface Y=%surface%)."
  already-enabled: "%prefix%<yellow>The arena %arena% is already enabled."
  enable-failed: "%prefix%<red>Unable to enable <yellow>%arena%<red>, incomplete configuration:"
  auto-disabled: "%prefix%<red>The configuration of <yellow>%arena% <red>is no longer valid: the arena has been disabled."
  validation-prefix: "<dark_gray> - "
  disabled: "%prefix%<green>Arena <yellow>%arena% <green>disabled."
  already-disabled: "%prefix%<yellow>The arena %arena% is already disabled."
  stopped: "%prefix%<green>Game of <yellow>%arena% <green>stopped, players and pool restored."
  not-running: "%prefix%<yellow>No game running in %arena%."
  forcestart: "%prefix%<green>Forced start of <yellow>%arena%<green>."
  forcestart-failed: "%prefix%<red>Unable to force the start (no player in the lobby or game already running)."
  reloaded: "%prefix%<green>Configuration reloaded <gray>(%arenas% arenas)."
  info:
    - "<dark_gray><st>        </st> <aqua>Arena %arena% <dark_gray><st>        </st>"
    - "<gray>State: %state% <dark_gray>| <gray>Enabled: %enabled%"
    - "<gray>World: <white>%world% <dark_gray>(<gray>loaded: %world_loaded%<dark_gray>)"
    - "<gray>Players: <white>%current%/%max% <dark_gray>(<gray>min <white>%min%<dark_gray>)"
    - "<gray>Lobby: %lobby%"
    - "<gray>Jump: %jump%"
    - "<gray>Spectator: %spectator%"
    - "<gray>Pos1: %pos1% <dark_gray>| <gray>Pos2: %pos2%"
    - "<gray>Pool: %pool% <dark_gray>(<white>%pool_size%<dark_gray>, <white>%cells% <gray>cells, surface Y=<white>%surface%<dark_gray>)"
    - "<gray>Game running: %game% <dark_gray>| <gray>Turn: <white>%turn%"
    - "<gray>Valid configuration: %valid%"

validation:
  world-missing: "<red>No world set (set a position in game)."
  world-not-loaded: "<red>The world <yellow>%world% <red>is not loaded."
  lobby-missing: "<red>Lobby not set <gray>(/dac setlobby %arena%)"
  jump-missing: "<red>Jump platform not set <gray>(/dac setjump %arena%)"
  spectator-missing: "<red>Spectator point not set <gray>(/dac setspectator %arena%)"
  pos1-missing: "<red>First corner of the pool not set <gray>(/dac pos1 %arena%)"
  pos2-missing: "<red>Second corner of the pool not set <gray>(/dac pos2 %arena%)"
  invalid-limits: "<red>Invalid player limits (min %min%, max %max%)."
  min-greater-than-max: "<red>The minimum number of players (%min%) is greater than the maximum (%max%)."
  not-enough-blocks: "<red>Only %blocks% unique blocks for %max% players max: add blocks to block-selector.materials or lower the maximum."
  pool-too-large: "<red>Pool too large: %width%x%length% (max %max_width%x%max_length%)."
  pool-too-deep: "<red>Pool too high: %depth% blocks (max %max_depth%)."
  pool-out-of-world: "<red>The pool is outside the height limits of the world."
  pool-no-water: "<red>The pool area does not contain any water."
  jump-inside-pool: "<red>The jump platform is inside the pool."
  lobby-inside-pool: "<red>The lobby is inside the pool."
  spectator-inside-pool: "<red>The spectator point is inside the pool."
  jump-too-low: "<red>The jump platform must be at least 2 blocks above the water surface (Y=%surface%)."

# Block names. A block missing from this list uses its Minecraft name,
# automatically translated into the language of each player.
colors:
  WHITE_CONCRETE: "<white>White Concrete"
  ORANGE_CONCRETE: "<gold>Orange Concrete"
  MAGENTA_CONCRETE: "<light_purple>Magenta Concrete"
  LIGHT_BLUE_CONCRETE: "<aqua>Light Blue Concrete"
  YELLOW_CONCRETE: "<yellow>Yellow Concrete"
  LIME_CONCRETE: "<green>Lime Concrete"
  PINK_CONCRETE: "<#F38BAA>Pink Concrete"
  GRAY_CONCRETE: "<dark_gray>Gray Concrete"
  LIGHT_GRAY_CONCRETE: "<gray>Light Gray Concrete"
  CYAN_CONCRETE: "<dark_aqua>Cyan Concrete"
  PURPLE_CONCRETE: "<dark_purple>Purple Concrete"
  BLUE_CONCRETE: "<blue>Blue Concrete"
  BROWN_CONCRETE: "<#835432>Brown Concrete"
  GREEN_CONCRETE: "<dark_green>Green Concrete"
  RED_CONCRETE: "<red>Red Concrete"
  BLACK_CONCRETE: "<#3C3C3C>Black Concrete"

scoreboard:
  title: "<aqua><bold>DÉ À COUDRE"
  countdown: "<white>%seconds% seconds"
  waiting-players: "<gray>%needed% player(s) missing"
  block-random: "<gray>Random"
  # %hearts% = one icon per life (full / lost). Text alternative: "<white>%lives% / %max_lives%"
  heart-full: "<red>❤"
  heart-empty: "<dark_gray>♡"
  status:
    WAITING: "<gray>Waiting"
    ALIVE: "<green>Alive"
    ELIMINATED: "<red>Eliminated"
  lobby:
    - ""
    - "<gray>Arena: <white>%arena%"
    - " "
    - "<gray>Players:"
    - "<white>%current%/%max%"
    - "  "
    - "<gray>Start:"
    - "%countdown%"
    - "   "
    - "<gray>Block: %block%"
    - "    "
    - "<yellow>%server%"
  game:
    - ""
    - "<gray>Arena: <white>%arena%"
    - " "
    - "<gray>Alive:"
    - "<white>%alive%/%total%"
    - "  "
    - "<gray>Turn:"
    - "%turn%"
    - "   "
    - "<gray>Your block:"
    - "%color%"
    - "    "
    - "<gray>Time: <white>%time%"
    - "<gray>Lives: %hearts%"
    - "<yellow>%server%"
  ending:
    - ""
    - "<gray>Arena: <white>%arena%"
    - " "
    - "<gold>Game over"
    - "  "
    - "<gray>Your status: %status%"
    - "<gray>Successful jumps: <white>%jumps%"
    - "   "
    - "<yellow>%server%"
